# /etc/nginx/sites-available/nbasim-api.conf
# Reverse-proxy + TLS for the NBASIM Node API on Ubuntu.
#
# Layout:
#   Netlify          -> https://bballsim.app          (React static)
#   This Nginx host  -> https://api.bballsim.app      (proxies to Node :5001)
#
# Install:
#   sudo cp deploy/nginx-nbasim.conf /etc/nginx/sites-available/nbasim-api.conf
#   sudo ln -s /etc/nginx/sites-available/nbasim-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.bballsim.app           # provisions TLS

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.bballsim.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bballsim.app;

    # certbot will populate these lines after `--nginx` runs.
    ssl_certificate     /etc/letsencrypt/live/api.bballsim.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bballsim.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow logo/avatar uploads from the client (server limit is 1mb JSON +
    # multer for files; bump if you increase server-side limits).
    client_max_body_size 10m;

    # Stricter HTTP security headers. CSP intentionally omitted here because
    # the API serves JSON/upload binaries, not HTML; helmet sets app-level
    # headers in Node already.
    add_header X-Frame-Options          "DENY"             always;
    add_header X-Content-Type-Options   "nosniff"          always;
    add_header Referrer-Policy          "no-referrer"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required so socket.io / multiplayer upgrades survive the proxy hop.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cheap, anonymous health probe for UptimeRobot etc.
    location = /healthz {
        proxy_pass http://127.0.0.1:5001/healthz;
        access_log off;
    }
}
